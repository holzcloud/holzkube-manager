# goreleaser v2 configuration.
#
# The dependency tree stays pure Go: CGO_ENABLED=0 is what makes one `goreleaser
# release` cross-compile every target from one machine, and it is the reason no
# cgo library (a cgo SQLite driver, most obviously) is ever taken as a
# dependency in this project.
version: 2

project_name: holzkube-manager

before:
  hooks:
    # The frontend is built before the Go compiler runs, here as in the
    # Taskfile: go:embed reads internal/httpapi/dist at compile time, so a
    # missing or stale bundle is silently baked into every archive.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: holzkube-managerd
    main: ./cmd/holzkube-managerd
    binary: holzkube-managerd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Intel macOS is not a target: holzkube-manager runs beside the cluster, and the
      # Apple hosts that do so are arm64.
      - goos: darwin
        goarch: amd64

  # The command-line client is its own build and its own archive, because it is
  # a different thing in a different place: the daemon runs beside the cluster
  # and carries the whole web UI inside it, and this runs on the laptop of
  # whoever is asking it questions.
  - id: holzkubectl
    main: ./cmd/holzkubectl
    binary: holzkubectl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # No ignore list, and the reasoning is the daemon's inverted. Intel macOS
    # is excluded above because nothing runs a cluster on one; people very much
    # still type commands on one. Windows is here for the same reason and only
    # for this binary: a terminal is a terminal, and nothing in this tool
    # touches a path, a signal or a socket that would behave differently there.

archives:
  - id: default
    ids:
      - holzkube-managerd
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/*

  # Separate, so that somebody who wants the client does not download a server
  # with a web UI compiled into it to get a file they could have fetched on its
  # own.
  - id: cli
    ids:
      - holzkubectl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "holzkubectl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs\('
      - '^test\('
      - '^chore\('

release:
  # Published, not a draft, and both halves of that are load-bearing for
  # deploy/holzkube-manager-update.sh rather than a matter of taste.
  #
  # The script reads /releases/latest, and that endpoint skips drafts AND
  # prereleases. A draft was the right default while a release was something a
  # person cut by hand and then looked at; it is the wrong one now that the
  # workflow cuts the release only after both gates are green on exactly the
  # commit being released, because the thing it holds back is no longer
  # unreviewed -- it is just unreachable.
  #
  # prerelease is therefore left at its default of false ON PURPOSE, including
  # for a -beta tag. Marking a beta as a prerelease reads as the careful choice
  # and is the one that breaks the update path: every host running the script
  # would go on installing the last non-prerelease build and say "aktuell",
  # which is the kind of wrong that looks like nothing happening. If betas
  # should ever stop being "latest", the script has to learn to ask for them
  # first -- the two settings move together or not at all.
  draft: false

# goreleaser v2 configuration.
#
# The dependency tree stays pure Go: CGO_ENABLED=0 is what makes one `goreleaser
# release` cross-compile every target from one machine, and it is the reason no
# cgo library (a cgo SQLite driver, most obviously) is ever taken as a
# dependency in this project.
version: 2

project_name: holzkube-manager

before:
  hooks:
    # The frontend is built before the Go compiler runs, here as in the
    # Taskfile: go:embed reads internal/httpapi/dist at compile time, so a
    # missing or stale bundle is silently baked into every archive.
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: holzkube-managerd
    main: ./cmd/holzkube-managerd
    binary: holzkube-managerd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Intel macOS is not a target: holzkube-manager runs beside the cluster, and the
      # Apple hosts that do so are arm64.
      - goos: darwin
        goarch: amd64

  # The command-line client is its own build and its own archive, because it is
  # a different thing in a different place: the daemon runs beside the cluster
  # and carries the whole web UI inside it, and this runs on the laptop of
  # whoever is asking it questions.
  - id: holzkubectl
    main: ./cmd/holzkubectl
    binary: holzkubectl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # No ignore list, and the reasoning is the daemon's inverted. Intel macOS
    # is excluded above because nothing runs a cluster on one; people very much
    # still type commands on one. Windows is here for the same reason and only
    # for this binary: a terminal is a terminal, and nothing in this tool
    # touches a path, a signal or a socket that would behave differently there.

archives:
  - id: default
    ids:
      - holzkube-managerd
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # The update script travels with the daemon and replaces itself on the
      # host after a healthy update, so a change to the update path needs no
      # hand work on the host.
      - deploy/holzkube-manager-update.sh
      # The host helper travels so the operator can install it from the
      # archive (deploy/HOST-HELPER.md). Unlike the update script, nothing
      # installs or replaces it: putting root code on the host is the
      # operator's decision every time, and the update script never names it.
      - deploy/holzkube-manager-host.sh
      - deploy/holzkube-manager-host.path
      - deploy/holzkube-manager-host.service
      - deploy/holzkube-manager-update-check.service
      # The hourly update's two units travel so the operator can install them
      # from the archive (deploy/HOST-HELPER.md, "The hourly update"). Like the
      # helper, nothing installs or replaces them: the update script replaces
      # the binary and itself, never a unit.
      - deploy/holzkube-manager-update.service
      - deploy/holzkube-manager-update.timer
      - deploy/HOST-HELPER.md
      # The Markdown only: docs/ also holds the README's screenshots and the
      # brand images, which are megabytes nobody installing a daemon needs.
      - docs/*.md

  # Separate, so that somebody who wants the client does not download a server
  # with a web UI compiled into it to get a file they could have fetched on its
  # own.
  - id: cli
    ids:
      - holzkubectl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "holzkubectl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs\('
      - '^test\('
      - '^chore\('

release:
  # Published and not a draft: the workflow cuts a release only after both
  # gates are green on exactly the commit being released, so a draft would
  # hold back nothing unreviewed -- it would only be unreachable.
  #
  # Every release IS a prerelease (the operator's decision, 2026-09-26: the
  # product is alpha, and GitHub should say so too). That and the update script
  # move together or not at all: /releases/latest skips prereleases, so
  # deploy/holzkube-manager-update.sh reads the release list and takes the
  # newest one that is not a draft. A host still running the script from
  # before that change finds nothing and needs the new one once; from then on
  # the script replaces itself from the archive (see `files` above).
  draft: false
  prerelease: "true"

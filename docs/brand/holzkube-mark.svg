<!-- holzkube-manager — Ringwabe: Jahresringe, in ein Sechseck geschnitten.
     Das Sechseck ist der Knoten, die Ringe sind die Holzcloud-Marke. Die Ringe
     sitzen leicht aus der Mitte, wie in einem Stamm, der ungleich gewachsen ist. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="holzkube-manager">
  <defs><clipPath id="hk-hex"><polygon points="32.00,4.00 56.25,18.00 56.25,46.00 32.00,60.00 7.75,46.00 7.75,18.00"/></clipPath></defs>
  <g clip-path="url(#hk-hex)">
    <rect width="64" height="64" fill="#F0AE5F"/>
    <g fill="none" stroke="#150E08" stroke-width="3.6"><circle cx="29.8" cy="30.4" r="4.8"/><circle cx="30.9" cy="31.2" r="12"/><circle cx="32" cy="32" r="19.2"/></g>
  </g>
</svg>

# Blank issues are off so that every report arrives with the fields triage needs.
# The two forms are short; the missing version and log excerpt in a free-form
# issue cost more round trips than the form costs to fill in.
blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability
    url: https://github.com/holzcloud/holzkube-manager/security/advisories/new
    about: >-
      Privately, never as an issue. holzkube-manager holds cluster PKI, so a public
      report is a working attack against every running instance.

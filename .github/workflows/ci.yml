# CI runs the same gates that pass on a developer machine, in the same order
# and with the same pinned tool versions. A check that only exists here is a
# check nobody can reproduce or fix without pushing a commit, so there are none.
name: CI

on:
  # Not on every push to main and not on pull requests: since 2026-09-28 the
  # operator's Actions minutes are used up, and a run per push spends them on
  # commits nobody releases. The gates run on the Pi before a push instead
  # (`./bin/task ci`), and here only when a release is asked for -- either way
  # below, and each runs the gates on the commit it releases before the
  # `release` job may start.
  push:
    # A pushed tag is built here, so that a release cannot be cut from a commit
    # that fails the gates below. See the `release` job.
    tags: ['v*']

  # The second way to cut a release, for a party that can write a branch and
  # not a tag -- which is the situation an agent session runs in. The tag stays
  # the source of truth: this input does not bypass it, it asks this workflow to
  # create it, with the job's own `contents: write` token, only after the gates
  # below have passed on the very commit being released.
  #
  # A tag pushed by GITHUB_TOKEN does not start another workflow run, so this
  # cannot release the same commit twice.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.1.0. Empty runs the gates only.'
        required: false
        type: string
      notes:
        description: 'Annotation for that tag. Empty means the tag name alone.'
        required: false
        type: string

# A superseded pull request run is cancelled; a run on main or on a tag is not.
# Cancelling a release halfway through leaves a partly uploaded draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build, lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A release is only cut from main
        if: inputs.tag != '' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::a release tag is created from main only; this run is on ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # go.mod carries `toolchain go1.26.7` and setup-go honours that line, so
      # the Go version is pinned in one place and CI cannot drift from a local
      # build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caches the module and build caches. Keyed on the root go.sum only:
          # sandbox/ is a separate module, deliberately outside this build.
          cache-dependency-path: go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.53.1

      # ci, not install: it installs exactly what web/package-lock.json pins and
      # fails if the lockfile and the manifest disagree. The frontend gates below
      # run before `task build`, so the install cannot wait for it.
      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint web
        run: npm --prefix web run lint

      # `npm --prefix web exec`, not a globally installed playwright: this runs
      # the copy web/package-lock.json pins, so the browser it downloads is the
      # one that version expects and the two cannot drift apart. It is the same
      # command the local failure message names, for the reason at the top of
      # this file -- a check only CI can run is a check nobody can reproduce, so
      # this step exists to make the two environments the same rather than to add
      # a gate that only lives here.
      #
      # The `--` is load-bearing. Without it npm eats `--with-deps` as one of its
      # own options and the step exits 0 having installed nothing, so the failure
      # would surface as a confusing browser-launch error in the step after this
      # one rather than here.
      - name: Install the browser the frontend tests measure in
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Test web
        run: npm --prefix web test

      # Builds the web bundle and then the binary. The ordering is a hard
      # dependency rather than a convention: go:embed reads
      # internal/httpapi/dist at compile time, so the two Go steps after this
      # one are the only ones that see a current bundle.
      - name: Build
        run: task build

      # v9, not v6: the v6 action only knows how to install golangci-lint v1,
      # and .golangci.yml is a v2 config. v7 was the first major to speak v2.
      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1

      # The host helper's root matrix (internal/host/hostaction and the round
      # trip in internal/httpapi) runs the script as root only inside an
      # unprivileged user namespace, and fails loudly when none can be made
      # rather than skip into a green "ok". ubuntu-latest forbids them through
      # AppArmor by default; this allows them for this job, so the matrix runs
      # here and is not merely reported.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # -timeout 20m: internal/httpapi alone takes about 3 min under -race here;
      # the default 10 min once cut a run off with no test failing (on the
      # macOS runner this workflow no longer has). The limit is for a hang.
      - name: Test Go
        run: go test ./... -count=1 -race -timeout 20m

      # Reachable known vulnerabilities in the Go code and its modules. Pinned
      # like the linter; Taskfile.yml's GOVULNCHECK_VERSION is the other copy.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # Last, because it starts the product and drives a browser over every
      # route, and because it needs the binary the Build step above produced.
      #
      # It asserts one thing: that nothing ends up past the right edge with no
      # way to scroll it back. An operator met that on a phone -- seventeen
      # controls on /settings, including the whole "New account" form and the
      # button that changes a password, simply gone, with no scrollbar and
      # nothing about the page looking wrong.
      #
      # In the chain rather than opt-in on purpose: ledger entries 5 and 64
      # record a drift watcher that existed, was never scheduled, and therefore
      # never watched anything.
      - name: Measure the layout at a phone width and a desk width
        run: npm --prefix web run test:layout

  release:
    name: Release
    # The only gate since releases carry linux/arm64 alone (2026-10-02): the
    # macOS job tested a darwin build that is no longer shipped.
    needs: [ci]
    # Either a tag was pushed, or this run was asked to create one. Both reach
    # goreleaser with a tag at HEAD, which is the only state it can release from.
    #
    # A dispatch that asks for a tag only releases from main: any branch a writer
    # can push would otherwise reach the Pi through the hourly update timer.
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.tag != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      # Creating the draft release and uploading the archives to it. Nothing
      # else: this workflow does not publish packages or write to pull requests.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # goreleaser derives the version from the tag and the changelog from
          # git history. A shallow clone gives it neither.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # .goreleaser.yaml runs `npm --prefix web ci` and `npm --prefix web run
      # build` in its before hooks, for the same go:embed reason as the Taskfile.
      # The release job therefore needs Node exactly as much as the build does.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Only on the dispatch path. On a tag push the tag is already here, and
      # this step does not run.
      #
      # The tag is created and pushed BEFORE goreleaser, because goreleaser
      # derives the version and the changelog range from the tag at HEAD --
      # without one it would refuse, and with `--snapshot` it would build
      # something that is not a release. Pushing it also means the repository
      # ends up in exactly the state the tag-push path produces, so the two
      # ways of cutting a release differ in who typed the tag and in nothing
      # else.
      - name: Create the tag this run releases
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          # goreleaser and the update script both read the leading v, and
          # .github/workflows' own tag filter is 'v*'. A tag that does not match
          # would produce a release nothing can find, so it is refused here
          # rather than discovered later.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::refusing to create '$TAG': a release tag starts with v and a digit"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; a release tag is never moved"
            exit 1
          fi

          # The release the operator will read about has to exist in the
          # changelog the binary embeds. This is the only moment the two can be
          # compared: the tag is known here and nowhere earlier, and after this
          # step it is too late -- a release whose version the panel has never
          # heard of shows an operator the previous release under a heading
          # that says nothing is wrong.
          #
          # It refuses rather than inventing an entry, because an entry
          # generated from the commit log is the thing internal/changelog
          # exists not to be.
          python3 - "$TAG" <<'CHANGELOG'
          import json, sys
          tag = sys.argv[1]
          with open('internal/changelog/changelog.json') as f:
              releases = json.load(f)
          if not any(r['version'] == tag for r in releases):
              known = ', '.join(r['version'] for r in releases[:5])
              sys.exit(f"::error::internal/changelog/changelog.json has no entry for {tag}. "
                       f"Add one before releasing it; the newest entries are: {known}")
          if releases[0]['version'] != tag:
              sys.exit(f"::error::{tag} is in the changelog but is not the first entry "
                       f"({releases[0]['version']} is). The file is newest first, and the panel "
                       f"opens on the first series it sees.")
          print(f"changelog carries {tag}")
          CHANGELOG

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Annotated, because goreleaser reads the annotation and a lightweight
          # tag has none. The message is the input when there is one and the tag
          # name when there is not -- never empty, which git refuses anyway.
          printf '%s\n' "${NOTES:-$TAG}" > /tmp/tag-message
          git tag -a "$TAG" -F /tmp/tag-message
          git push origin "refs/tags/$TAG"

      # The release page carries the changelog entry, the same words the app's
      # "What's new" panel shows, rather than goreleaser's commit list. Both
      # paths reach here with an annotated tag at HEAD; its message is the
      # dispatch input's notes, or whatever the tag was pushed with.
      - name: Write the release notes from the changelog
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "$TAG" > /tmp/tag-annotation
          python3 .github/release-notes.py "$TAG" /tmp/tag-annotation > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser being green means it uploaded what it built. It does not mean
      # the release carries what an operator downloads, and the two have already
      # come apart once -- see .github/verify-release.py, which says which four
      # things it checks and why each of them can be false while everything here
      # reports success.
      #
      # It runs against the API rather than against dist/, because the artifact
      # an operator installs is the one GitHub is serving, not the one the
      # runner has on disk.
      - name: Verify the release an operator would download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: python3 .github/verify-release.py "$GITHUB_REPOSITORY" "$TAG"

  # holzcloud.ch shows the released version on the project page in five
  # languages. This writes it there through the CMS, after the release above
  # exists, and reads it back. .github/cms-version.py is a copy of
  # holzcloud-design's tools/cms-version.py (that repository is private, so
  # its reusable workflow cannot be called from here). Without the CMS_TOKEN
  # secret it prints a notice and succeeds; a failure here leaves the release
  # itself untouched.
  holzcloud-ch:
    name: Show the version on holzcloud.ch
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Write the version into the project pages and read it back
        env:
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: python3 .github/cms-version.py --project holzkube-manager --version "$TAG"

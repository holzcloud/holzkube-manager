# One-off, 2026-09-26: delete the tags the release reset left behind. A tag
# ruleset refused their deletion on the first attempt (422 "Cannot delete this
# tag"); this retries once the operator has lifted it. Every tag except the
# ones named in `keep` goes -- among them an old v0.1.0 that would otherwise
# block the real v0.1.0 later. Removed again after its run.

name: Reset tags (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type delete-old-tags to delete every tag not listed in keep'
        required: true
      keep:
        description: 'Space-separated tags that stay'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'delete-old-tags'
    steps:
      - name: Delete every tag not kept
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/git/matching-refs/tags" -q '.[].ref' > tags.txt
          echo "tags: $(wc -l < tags.txt), keeping: $KEEP"
          failed=0
          while read -r ref; do
            tag=${ref#refs/tags/}
            case " $KEEP " in *" $tag "*) echo "kept $tag"; continue ;; esac
            if gh api -X DELETE "repos/$REPO/git/$ref" >/dev/null 2>err.txt; then
              echo "deleted $tag"
            else
              echo "::error::could not delete $tag: $(tr '\n' ' ' < err.txt)"; failed=1
            fi
          done < tags.txt
          exit $failed

      - name: Only the kept tags are left
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/git/matching-refs/tags" -q '.[].ref'

# One-off, 2026-09-27: mark every published release as a prerelease, the
# operator's decision for this alpha. New releases get the mark from
# .goreleaser.yaml; this covers the ones cut before that. Removed after its run.

name: Mark releases as prereleases (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --repo "$REPO" --limit 1000 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease | not) | .tagName' > todo.txt
          while read -r tag; do
            gh release edit "$tag" --repo "$REPO" --prerelease
            echo "marked $tag"
          done < todo.txt
          left=$(gh release list --repo "$REPO" --limit 1000 --json isPrerelease -q '[.[] | select(.isPrerelease | not)] | length')
          echo "not prerelease: $left"
          [ "$left" = 0 ]

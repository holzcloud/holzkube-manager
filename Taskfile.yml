version: '3'

vars:
  BINARY: bin/holzkube-managerd
  CLI: bin/holzkubectl
  WEB_DIST: internal/httpapi/dist
  # A working-tree build is honestly called what git calls it; goreleaser passes
  # the real tag through the same variable. The substitution is plain shell so
  # that nothing here depends on a go-task version-specific var syntax.
  LDFLAGS: -s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
  # The linter version CI pins. It is here so that `task lint:go` can name it
  # next to the one actually installed; changing it means changing
  # .github/workflows/ci.yml in the same commit.
  GOLANGCI_VERSION: v2.13.1
  GOVULNCHECK_VERSION: v1.8.0
  # The race detector's ThreadSanitizer refuses the Raspberry Pi 5 kernel's
  # 47-bit address space, so on aarch64 the tests run without it and the race
  # detector stays CI's alone (CLAUDE.md). Everywhere else it is on.
  RACE:
    sh: '[ "$(uname -m)" = aarch64 ] || echo -race'

# The gates build with the toolchain go.mod names, which is the one CI and the
# releases use. Without this, a newer Go installed on the machine wins -- go.mod's
# `toolchain` line only ever upgrades -- and "green here" stops meaning "green
# for the release". That happened: the Pi ran go1.27.1 against a release built
# with go1.26.7 (.planning/debug/resolved/installer-requestion-arm64.md).
# `test:next` is where the installed, newer Go gets its say.
env:
  GOTOOLCHAIN:
    sh: awk '/^toolchain /{print $2}' go.mod

tasks:
  default:
    cmds:
      - task: build

  build:web:
    desc: Build the web UI into the directory the binary embeds.
    cmds:
      # `npm ci`, not `npm install`: ci installs exactly what web/package-lock.json
      # pins and fails if the lockfile and the manifest disagree, which is the
      # difference between a build that succeeds and a build that is reproducible.
      - npm --prefix web ci
      - npm --prefix web run build
      # web/vite.config.ts re-emits the placeholder that vite's emptyOutDir would
      # otherwise delete. This is the belt to that pair of braces: the file is
      # tracked so `go build` works on a fresh clone, and losing it is a silent
      # break that only shows up for somebody else.
      - test -f {{.WEB_DIST}}/.gitkeep || touch {{.WEB_DIST}}/.gitkeep
    sources:
      - web/package.json
      - web/package-lock.json
      - web/index.html
      - web/vite.config.ts
      - web/tsconfig.json
      - web/src/**/*
    generates:
      - '{{.WEB_DIST}}/index.html'

  build:go:
    desc: Compile the binary with the UI embedded.
    # Hard dependency, not a convention: go:embed reads the dist directory at
    # compile time, so a stale or missing bundle is baked into the binary.
    # `go generate` is deliberately not used -- it does not run during `go build`
    # and produces stale-asset bugs that look like frontend bugs.
    deps: ["build:web"]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/holzkube-managerd

  build:cli:
    desc: Compile holzkubectl, the command-line client.
    # No dependency on build:web, deliberately. The CLI embeds nothing and
    # talks to a server over HTTP, so making it wait on `npm ci` would be a
    # two-minute build for a two-megabyte binary that does not contain any of
    # it.
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.CLI}} ./cmd/holzkubectl

  build:
    desc: Build everything into bin/.
    deps: ["build:go", "build:cli"]

  test:
    desc: Run the Go tests with the release toolchain (and the race detector where it runs).
    cmds:
      - go test ./... -count=1 {{.RACE}}

  vuln:
    desc: Fail when the code calls a function with a known vulnerability.
    # govulncheck reports only vulnerabilities the code can reach, so a finding
    # is a reason to act and not a feed to read. It needs the network (the
    # vulnerability database), which the gates here and in CI have; the version
    # is pinned like the linter's, in the same place as CI's step.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  test:next:
    desc: Run the Go tests once more with the locally installed Go, as an early warning.
    # Not a gate: a failure here is news about the next Go release, not a
    # reason to stop. It is how the fake registry that stopped being silent
    # under go1.27 was found, while every gate on go1.26.7 stayed green.
    ignore_error: true
    env:
      GOTOOLCHAIN: local
    cmds:
      - go version
      - go test ./... -count=1

  test:web:
    desc: Run the frontend tests.
    cmds:
      # Both vitest projects: the jsdom suite and the browser one that measures
      # layout. The command did not change when the second project was added, so
      # neither this target nor CI's `Test web` step can forget it.
      - npm --prefix web run test

  test:web:browser:
    desc: Run only the frontend tests that measure layout in a real browser.
    cmds:
      # For iterating on a layout question without the other 111 tests. It needs
      # a Chromium; `npm --prefix web exec -- playwright install chromium` fetches
      # the one the pinned playwright expects, and the run says so when it is
      # missing.
      - npm --prefix web run test:browser

  test:layout:
    desc: Measure the interface at a phone width and a desk width; fail if anything is out of reach.
    # Depends on the binary rather than on the bundle: this drives the whole
    # product -- the daemon serving the embedded UI, a real session, every route
    # as an operator reaches it. A component rendered on its own cannot answer
    # the question, because what pushed seventeen controls off the side of
    # /settings was the shell around them.
    deps: ["build:go"]
    cmds:
      - npm --prefix web run test:layout

  lint:go:
    desc: Lint the Go sources.
    cmds:
      # The version is printed rather than merely used. CI pins
      # {{.GOLANGCI_VERSION}} in .github/workflows/ci.yml, and a local binary
      # built against an older Go than go.mod targets refuses to run at all --
      # which is how this project once carried an "the linter cannot run here"
      # note for a month while CI ran it on every push and reported the
      # findings to nobody. A version on screen makes the two comparable.
      #
      # If the local binary refuses to run, install the pinned one rather than
      # working around it. `task lint:go:install` does exactly what CI does,
      # and this target prefers what it leaves in ./bin over whatever is on
      # PATH -- because the PATH copy is the one nobody chose. A host with an
      # older golangci-lint installed for some other repository refuses to
      # load this config at all ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version"), and a host with
      # a *newer* one is worse: it runs, it disagrees with CI, and nothing
      # says which of the two answers is the one that will block a push.
      #
      # Ledger 34: the binary is resolved here, not left to the caller's PATH.
      # `go install` puts it in $(go env GOPATH)/bin, which is off the default
      # PATH, and a bare `golangci-lint` then reads as a missing tool; and a
      # stale ./bin copy is worse than none, because it refuses the module's Go
      # version and looks like a broken repository. So every place it can be
      # is asked, and the first one that is the pinned version wins.
      - |
        want="{{.GOLANGCI_VERSION | trimPrefix "v"}}"
        lint=""
        for c in ./bin/golangci-lint "$(go env GOPATH)/bin/golangci-lint" "$(command -v golangci-lint || true)"; do
          [ -n "$c" ] && [ -x "$c" ] || continue
          if "$c" --version 2>/dev/null | grep -q "version $want "; then lint=$c; break; fi
        done
        if [ -z "$lint" ]; then
          echo "golangci-lint $want not found in ./bin, \$(go env GOPATH)/bin or PATH; run: task lint:go:install" >&2
          exit 1
        fi
        "$lint" --version
        "$lint" run

  lint:go:install:
    desc: Install the exact golangci-lint CI pins, into ./bin.
    # The same tarball the CI action downloads, at the same version, for this
    # host's architecture. It exists because "the linter does not run here" is
    # a sentence that costs a round trip through CI for every lint finding,
    # and this project has paid that cost enough times to write the three
    # lines that end it.
    cmds:
      - mkdir -p bin
      - |
        os=$(go env GOOS)
        arch=$(go env GOARCH)
        name="golangci-lint-{{.GOLANGCI_VERSION | trimPrefix "v"}}-${os}-${arch}"
        url="https://github.com/golangci/golangci-lint/releases/download/{{.GOLANGCI_VERSION}}/${name}.tar.gz"
        echo "fetching ${url}"
        curl -sSfL "$url" | tar xz -C bin --strip-components=1 "${name}/golangci-lint"
      - ./bin/golangci-lint --version

  lint:web:
    desc: Lint and format-check the frontend sources.
    cmds:
      - npm --prefix web run lint

  lint:
    desc: Lint everything.
    cmds:
      - task: lint:go
      - task: lint:web

  ci:
    desc: Run the gates CI runs, in CI's order, so that "it is green here" means the same thing.
    #
    # It exists because it did not, and the gap had a cost: local runs used
    # `task test` and `task lint:web`, CI additionally ran the pinned Go linter
    # and the frontend suite, and main sat red for nine commits while every
    # local run was green. The order is CI's rather than a convenient one --
    # the web gates come first because they are the quickest to fail, and the
    # build precedes the Go steps because go:embed reads the bundle.
    cmds:
      - npm --prefix web ci
      - task: lint:web
      - task: test:web
      - task: build
      - task: lint:go
      - task: test
      - task: vuln
      # Last because it is the slowest: it starts the product and drives a
      # browser over every route. In the chain rather than opt-in, because
      # ledger entries 5 and 64 record a drift watcher that existed, was never
      # scheduled, and therefore never watched anything.
      - task: test:layout
      # After every gate, and never able to fail the chain (see test:next).
      - task: test:next

  fmt:
    desc: Format Go and frontend sources in place.
    cmds:
      - gofmt -w ./cmd ./internal
      - npm --prefix web run format

  dev:
    desc: Run the Vite dev server against a locally running holzkube-managerd.
    cmds:
      - npm --prefix web run dev

  clean:
    desc: Remove build output.
    cmds:
      - rm -rf bin dist
      # Everything vite produced, but never the tracked placeholder: without it
      # go:embed fails outright on a fresh clone.
      - find {{.WEB_DIST}} -mindepth 1 ! -name .gitkeep -exec rm -rf {} +

  release:snapshot:
    desc: Build the release archives locally, without tagging or publishing.
    cmds:
      - goreleaser release --snapshot --clean

  <g clip-path="url(#hk-hex)">
    <rect width="64" height="64" fill="#F0AE5F"/>
    <g fill="none" stroke="#150E08" stroke-width="5"><circle cx="31" cy="31.2" r="6.5"/><circle cx="32" cy="32" r="17.5"/></g>
  </g>

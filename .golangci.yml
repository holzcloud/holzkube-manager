# golangci-lint v2 configuration schema. A v1 file is not read by v2, so the
# version line is load-bearing rather than decorative.
version: "2"

run:
  timeout: 5m
  # Tests are linted too. Much of a security tool's file handling lives in its
  # tests, and a test that leaks a fixture still leaks.
  tests: true

linters:
  # `standard` is errcheck, govet, ineffassign, staticcheck and unused. They are
  # named again below so this file states the whole set instead of half of it
  # plus an implicit default a reader has to already know about.
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr

  settings:
    errcheck:
      check-type-assertions: true

  exclusions:
    generated: lax

    # The linter's own curated set for deferred Close, Fprintf to a buffer and
    # the other cases where the returned error carries nothing a caller could
    # act on. A published list, not a hand-drawn one.
    presets:
      - std-error-handling

    # Every exclusion below names a rule and a place. No linter is switched off
    # wholesale, and nothing here weakens gosec on production code -- which is
    # the point of running gosec in a tool that holds cluster PKI.
    rules:
      # Test files create wrong-permission files and traversal-shaped paths on
      # purpose: that is how the permission guard and the key validation are
      # proven to reject them, so flagging the fixture inverts the finding.
      # Response bodies in tests live for the length of one test binary.
      - path: _test\.go$
        linters:
          - gosec
          - bodyclose

      # G304 is "file path from a variable". Three packages own files by design:
      # the store is the only thing allowed to touch state records, the audit log
      # owns its append-only archive, and tlsx owns the TLS material. Taking a
      # path in a variable is their whole job. Everywhere else G304 stays on,
      # which is what keeps it worth reading when it does fire.
      - path: internal/(store|audit|tlsx)/
        linters:
          - gosec
        text: "G304"

      # G104 re-reports unchecked errors that errcheck already owns, and it does
      # not honour the std-error-handling list above, so the two disagree about
      # the same lines. errcheck is the one kept.
      - linters:
          - gosec
        text: "G104"

formatters:
  enable:
    - gofmt

issues:
  # Report everything. The defaults cap output at 50 per linter and 3 per rule,
  # which turns "the lint is nearly clean" into a statement about the cap.
  max-issues-per-linter: 0
  max-same-issues: 0
